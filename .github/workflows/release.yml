name: Build Go Project with Makefile and Publish to Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GO_ENV: production
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: ${{ secrets.DB_PORT }}
      SECRET_KEY_ACCESS: ${{ secrets.SECRET_KEY_ACCESS }}
      SECRET_KEY_REFRESH: ${{ secrets.SECRET_KEY_REFRESH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Print Go version
        run: go version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git ca-certificates

      - name: Tidy Go modules
        run: go mod tidy

      - name: Build project with Makefile
        run: make build

      - name: Archive binaries
        run: tar -czf bin.tar.gz -C bin .

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin.tar.gz
          tag_name: ${{ github.ref_name }}
          body: "🚀 Release built using Go 1.23 and Make"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
